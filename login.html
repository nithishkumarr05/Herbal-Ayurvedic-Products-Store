    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {
                        herb: '#EA580C',

                        soil: '#7F1D1D',

                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },

        /* LOGIN CARD — earthy */

<body class="bg-cream dark:bg-canvas-dark herb-pattern">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="fixed top-3 right-3 sm:top-5 sm:right-5 z-50 flex items-center gap-2.5 sm:gap-3 rtl:right-auto rtl:left-3 sm:rtl:left-5">
        <button id="theme-toggle"
            class="w-10 h-10 rounded-full bg-sand dark:bg-dusk/40 text-herb dark:text-[#A7F3D0] hover:scale-110 transition flex items-center justify-center">
            <i class="fas fa-moon dark:hidden text-herb"></i>
            <i class="fas fa-sun hidden dark:inline text-amber-300"></i>
        </button>
        <button id="rtl-toggle"
            class="w-10 h-10 rounded-full bg-sand dark:bg-dusk/40 text-herb dark:text-[#A7F3D0] hover:scale-110 transition flex items-center justify-center font-bold text-base"
            title="Toggle RTL/LTR">⇄</button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center mb-8">
                <a href="index.html" class="flex items-center gap-2 md:gap-3 group shrink-0">
                    <div class="brand-logo group-hover:scale-105 transition duration-300">
                        <i class="fas fa-leaf text-white text-base md:text-lg animate-herb-spin"></i>
                    </div>
                    <div>
                        <span class="text-xl md:text-2xl font-display font-bold tracking-tight text-soil dark:text-white">NatureVeda</span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back, Seeker</h1>
                <p class="welcome-subtitle">Sign in to explore herbs, book consultations &amp; nourish your wellness</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="#" method="GET">

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-herb dark:text-[#A7F3D0] input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-herb dark:text-[#A7F3D0] input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- remember + forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-black dark:text-white">
                        <input type="checkbox"
                            class="rounded border-gray-300 dark:border-gray-600 text-herb dark:text-[#A7F3D0] focus:ring-herb/30 dark:bg-gray-700"
                            checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-black dark:text-white hover:text-herb font-medium transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="hoop-btn mt-3">
                    Sign In
                </button>

                <!-- divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-sand dark:border-gray-700"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#1C241E] px-4 py-0.5 text-black dark:text-white rounded-full">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-6">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-sand dark:border-gray-700/40">
                <p class="text-sm md:text-base font-semibold text-black dark:text-white">
                    New to the Ayurveda community? 
                    <a href="signup.html" class="text-herb dark:text-herb hover:text-herb-dark font-bold transition ml-1 rtl:mr-1 hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
    </div>


    <!-- ===== SCRIPTS ===== -->
    <script>
        (function () {
            
        // ---------- THEME TOGGLE ----------
        const themeToggle = document.getElementById('theme-toggle');
        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            setTheme(true);
        } else if (savedTheme === 'light') {
            setTheme(false);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme(true);
        }
        if (themeToggle) {
            themeToggle.addEventListener('click', (e) => {
                e.preventDefault();
                setTheme(!document.documentElement.classList.contains('dark'));
            });
        }

        // ---------- RTL TOGGLE ----------
        const rtlBtn = document.getElementById('rtl-toggle');
        function setRTL(isRTL) {
            if (isRTL) {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
                localStorage.setItem('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', 'en');
                localStorage.setItem('dir', 'ltr');
            }
        }
        const savedDir = localStorage.getItem('dir');
        if (savedDir === 'rtl') setRTL(true);
        else setRTL(false);

        if (rtlBtn) {
            rtlBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const currentDir = document.documentElement.getAttribute('dir');
                setRTL(currentDir !== 'rtl');
            });
        }

        // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
            const toggleButtons = document.querySelectorAll('.toggle-password');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    if (passwordInput) {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            if (type === 'text') {
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            } else {
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            }
                        }
                    }
                });
            });

            // ---------- FORGOT PASSWORD HANDLER ----------
            const forgotLink = document.getElementById('forgotPasswordLink');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🌿 A password reset link will be sent to your email. Check your inbox!');
                });
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const email = document.getElementById('login-email')?.value;
                    const password = document.getElementById('login-password')?.value;

                    if (!email || !password) {
                        alert('Please enter both email and password');
                        return;
                    }

                    // Redirect to home page (or dashboard)
                    window.location.href = 'index.html';
                });
            }

            // ---------- SOCIAL LOGIN HANDLER ----------
            window.socialLogin = function (provider) {
                alert(`🔐 ${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here.\n\n🌱 Welcome to the Ayurveda community!`);
            };

        })();
    </script>
